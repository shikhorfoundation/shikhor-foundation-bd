<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shikhor Foundation | Admin Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F7F1EB] text-[#231712] min-h-screen font-sans">

  <!-- Login Screen -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-[#DFD0C2] p-8">
      <div class="text-center mb-6">
        <img src="./logo.png" alt="Shikhor Logo" onerror="this.style.display='none'" class="w-16 h-16 mx-auto rounded-2xl object-cover mb-3 border border-[#D4C3B3]" />
        <h1 class="text-2xl font-bold text-[#231712]">Shikhor Foundation</h1>
        <p class="text-sm text-[#7A5643] mt-1">Admin Control Panel Login</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-[#6E4730] mb-1">Admin ID / Email</label>
          <input id="loginUser" type="text" required placeholder="shikhor@bd" class="w-full px-4 py-2.5 rounded-xl border border-[#D4C3B3] focus:outline-none focus:ring-2 focus:ring-[#8C583A]" />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-[#6E4730] mb-1">Password</label>
          <input id="loginPass" type="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-[#D4C3B3] focus:outline-none focus:ring-2 focus:ring-[#8C583A]" />
        </div>
        <p id="loginError" class="text-xs font-semibold text-red-600 hidden"></p>
        <button type="submit" class="w-full py-3 rounded-xl bg-[#4E2D1C] hover:bg-[#381F12] text-white font-semibold transition">Login to Panel</button>
      </form>
    </div>
  </div>

  <!-- Main Admin Dashboard -->
  <div id="adminDashboard" class="hidden">
    <header class="bg-[#381F12] text-white sticky top-0 z-30 shadow-md">
      <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <img src="./logo.png" alt="Logo" onerror="this.style.display='none'" class="w-10 h-10 rounded-xl object-cover border border-[#B88655]" />
          <div>
            <div class="font-bold text-base leading-tight">Shikhor Admin Control Panel</div>
            <div id="syncStatusText" class="text-xs text-[#E5C9B0]">Ready</div>
          </div>
        </div>
        <div class="flex items-center gap-2.5">
          <button id="pushSheetBtn" type="button" onclick="pushAllToSheet(true)" class="px-4 py-2 rounded-xl bg-[#B88655] hover:bg-[#9E6F42] text-[#231712] font-bold text-xs transition">
            Push To Sheet
          </button>
          <button type="button" onclick="logoutAdmin()" class="px-4 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-white font-semibold text-xs transition">
            Logout
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-8">
      <!-- Tabs -->
      <div class="flex flex-wrap gap-2">
        <button type="button" data-tab="teamTab" onclick="switchTab('teamTab')" class="tab-btn px-4 py-2 rounded-xl bg-[#4E2D1C] text-white text-sm font-semibold">Team Panel (<span id="teamCountBadge">14</span>)</button>
        <button type="button" data-tab="sectionsTab" onclick="switchTab('sectionsTab')" class="tab-btn px-4 py-2 rounded-xl bg-white text-[#4E2D1C] border border-[#D4C3B3] text-sm font-semibold">Site Sections</button>
        <button type="button" data-tab="noticeTab" onclick="switchTab('noticeTab')" class="tab-btn px-4 py-2 rounded-xl bg-white text-[#4E2D1C] border border-[#D4C3B3] text-sm font-semibold">Notice & News</button>
      </div>

      <!-- Team Tab -->
      <section id="teamTab" class="tab-panel space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-[#DFD0C2]">
          <div>
            <h2 class="text-lg font-bold">Leadership & Panel Members</h2>
            <p class="text-xs text-[#7A5643]">Display Position 1 = First. Changes auto-save locally and sync to Google Sheet.</p>
          </div>
          <button type="button" onclick="addMember()" class="px-4 py-2 rounded-xl bg-[#4E2D1C] hover:bg-[#381F12] text-white text-xs font-bold">+ Add Member</button>
        </div>
        <div id="teamGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
      </section>

      <!-- Sections Tab -->
      <section id="sectionsTab" class="tab-panel hidden bg-white p-6 rounded-3xl border border-[#DFD0C2] space-y-4">
        <h2 class="text-lg font-bold">Site Sections & Counters</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold text-[#6E4730] mb-1">Families Supported</label>
            <input id="sec_familiesCount" type="text" oninput="updateSectionField('familiesCount', this.value)" class="w-full px-3 py-2 rounded-xl border border-[#D4C3B3] text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-[#6E4730] mb-1">Active Volunteers</label>
            <input id="sec_volunteersCount" type="text" oninput="updateSectionField('volunteersCount', this.value)" class="w-full px-3 py-2 rounded-xl border border-[#D4C3B3] text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-[#6E4730] mb-1">Successful Events</label>
            <input id="sec_eventsCount" type="text" oninput="updateSectionField('eventsCount', this.value)" class="w-full px-3 py-2 rounded-xl border border-[#D4C3B3] text-sm" />
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-bold text-[#6E4730] mb-1">Hero Headline</label>
            <input id="sec_heroTitle" type="text" oninput="updateSectionField('heroTitle', this.value)" class="w-full px-3 py-2 rounded-xl border border-[#D4C3B3] text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-[#6E4730] mb-1">bKash / Nagad Donation Number</label>
            <input id="sec_donationNumber" type="text" oninput="updateSectionField('donationNumber', this.value)" class="w-full px-3 py-2 rounded-xl border border-[#D4C3B3] text-sm" />
          </div>
          <div class="md:col-span-3">
            <label class="block text-xs font-bold text-[#6E4730] mb-1">Hero Sub-description</label>
            <textarea id="sec_heroSubtitle" rows="2" oninput="updateSectionField('heroSubtitle', this.value)" class="w-full px-3 py-2 rounded-xl border border-[#D4C3B3] text-sm"></textarea>
          </div>
          <div class="md:col-span-3">
            <label class="block text-xs font-bold text-[#6E4730] mb-1">About Us Description</label>
            <textarea id="sec_aboutText" rows="3" oninput="updateSectionField('aboutText', this.value)" class="w-full px-3 py-2 rounded-xl border border-[#D4C3B3] text-sm"></textarea>
          </div>
        </div>
      </section>

      <!-- Notice Tab -->
      <section id="noticeTab" class="tab-panel hidden bg-white p-6 rounded-3xl border border-[#DFD0C2] space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-bold">Notices & News</h2>
          <button type="button" onclick="addNotice()" class="px-4 py-2 rounded-xl bg-[#4E2D1C] text-white text-xs font-bold">+ Add Notice/News</button>
        </div>
        <div id="noticeList" class="space-y-3"></div>
      </section>
    </main>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "PASTE_YOUR_DEPLOYED_APPS_SCRIPT_WEB_APP_URL_HERE";
    const AUTH_USER = "shikhor@bd";
    const AUTH_PASS = "shikhor2026"; // Change as needed

    const STORAGE_KEY = "shikhor_admin_state_v1";
    const SESSION_AUTH_KEY = "shikhor_admin_authed_v1";
    const SESSION_ID_KEY = "shikhor_admin_session_id_v1";
    const SESSION_LOGIN_TS_KEY = "shikhor_admin_login_ts_v1";
    const SESSION_LOGGED_KEY = "shikhor_admin_login_sent_v1";

    const DEFAULT_TEAM = [
      { id: "tm-1", name: "Md. Shewise Al Islam Zarif", role: "Founder & CEO / President", photo: "./zarif.jpg", status: "Active" },
      { id: "tm-2", name: "Ahsan Zaman", role: "Co-Founder & Vice President", photo: "./ahsan.jpg", status: "Active" },
      { id: "tm-3", name: "Md. Nafew Khalil", role: "Vice President of Program Organisation", photo: "./nafew.jpg", status: "Active" },
      { id: "tm-4", name: "Md. Shakhawat Hossain Sayem", role: "Head Of Administration & Marketing", photo: "./shakhawat.jpg", status: "Active" },
      { id: "tm-5", name: "MD. Minhajul Islam", role: "Head of Accounts & Finance", photo: "./minhajul.jpg", status: "Active" },
      { id: "tm-6", name: "Faymul Islam Shafi", role: "Head Of Volunteer", photo: "./shafi.jpg", status: "Active" },
      { id: "tm-7", name: "Shaila Ekbal Ritu", role: "Website Administrator", photo: "./logo.png", status: "Active" },
      { id: "tm-8", name: "Sayed Bin Kamal", role: "Asst. Head Of Administration", photo: "./logo.png", status: "Active" },
      { id: "tm-9", name: "Alif Hasan Ayman", role: "Asst. Head of Accounts & Finance", photo: "./logo.png", status: "Active" },
      { id: "tm-10", name: "Rikto Ruddur Lyric", role: "Asst. Head Of Marketing", photo: "./rikto.png", status: "Active" },
      { id: "tm-11", name: "Mayasha Afrin", role: "Asst. Head of volunteer", photo: "./logo.png", status: "Active" },
      { id: "tm-12", name: "Wahid Yashfi", role: "Executive member", photo: "./logo.png", status: "Active" },
      { id: "tm-13", name: "Raiyanul Islam Rahat", role: "Executive Member", photo: "./logo.png", status: "Active" },
      { id: "tm-14", name: "Arafat Sultan", role: "Executive Member", photo: "./logo.png", status: "Active" }
    ];

    const DEFAULT_SECTIONS = {
      familiesCount: "50+",
      volunteersCount: "50+",
      eventsCount: "10+",
      heroTitle: "A little kindness can grow into a better tomorrow.",
      heroSubtitle: "Rooted in Humanity, Growing with Compassion. We bring people together to support communities, stand beside those facing hardship, and create positive change.",
      aboutText: "Shikhor Foundation is a community-driven humanitarian initiative built on a simple belief: meaningful change begins when we care for one another. Like the roots of a tree, compassion, unity, and responsibility help communities stand strong.",
      donationNumber: "+8801956631465",
      logoUrl: "./logo.png",
      founderName: "Md. Shewise Al Islam Zarif",
      founderRole: "Founder & CEO / President",
      founderQuote: "Shikhor Foundation was born from a deep desire to stand beside those in need. Like the roots of a tree that nourish the branches above, our community's compassion empowers every individual to look forward with hope and dignity. Together, we are building a better tomorrow.",
      founderPhoto: "./zarif.jpg"
    };

    const DEFAULT_NOTICE = [
      {
        id: "item-notice-1",
        category: "Notice",
        status: "Published",
        date: "25 Nov 2026",
        title: "Volunteer & Community Drive",
        image: "./gallery1.jpg",
        summary: "Official notices and upcoming humanitarian drives of Shikhor Foundation are published here live.",
        fullContent: "Official notices and upcoming humanitarian drives of Shikhor Foundation are published here live. Interested volunteers and supporters can stay tuned for schedule updates, field locations, and registration details."
      },
      {
        id: "item-news-1",
        category: "News",
        status: "Published",
        date: "25 Nov 2026",
        title: "Standing Together for Communities",
        image: "./gallery2.jpg",
        summary: "Recent news stories, relief updates, and ground reports from Shikhor Foundation.",
        fullContent: "Recent news stories, relief updates, and ground reports from Shikhor Foundation are featured here. Every initiative is driven by compassion, community participation, and transparent action to support families in need."
      }
    ];

    let state = loadLocalState();
    let syncTimer = null;
    let logoutSentForSession = false;

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getDeviceInfo() {
      const ua = navigator.userAgent || "";
      let os = "Desktop";
      if (/Android/i.test(ua)) os = "Android Mobile";
      else if (/iPhone|iPad|iPod/i.test(ua)) os = "iOS Device";
      else if (/Windows/i.test(ua)) os = "Windows PC";
      else if (/Mac OS X/i.test(ua)) os = "macOS";

      let browser = "Browser";
      if (/Edg\//i.test(ua)) browser = "Microsoft Edge";
      else if (/Chrome\//i.test(ua)) browser = "Google Chrome";
      else if (/Firefox\//i.test(ua)) browser = "Firefox";
      else if (/Safari\//i.test(ua)) browser = "Safari";

      return `${os} (${browser}) | Screen: ${window.screen.width}x${window.screen.height}`;
    }

    function sendSessionEvent(eventType) {
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.startsWith("PASTE_")) return;
      const sessionId = sessionStorage.getItem(SESSION_ID_KEY) || "";
      const loginTs = Number(sessionStorage.getItem(SESSION_LOGIN_TS_KEY) || Date.now());
      const durationSeconds = Math.max(1, Math.round((Date.now() - loginTs) / 1000));

      const payload = JSON.stringify({
        action: eventType === "login" ? "logAdminLogin" : "logAdminLogout",
        sessionId,
        adminUser: AUTH_USER,
        durationSeconds,
        deviceInfo: getDeviceInfo()
      });

      if (eventType === "logout" && navigator.sendBeacon) {
        try {
          navigator.sendBeacon(GOOGLE_SCRIPT_URL, new Blob([payload], { type: "text/plain;charset=utf-8" }));
          return;
        } catch (_) {}
      }

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: payload
      }).catch(() => {});
    }

    function startAdminSession() {
      const existingId = sessionStorage.getItem(SESSION_ID_KEY);
      const alreadySent = sessionStorage.getItem(SESSION_LOGGED_KEY) === "1";
      logoutSentForSession = false;

      if (!existingId) {
        sessionStorage.setItem(SESSION_ID_KEY, "ADM-" + Date.now());
        sessionStorage.setItem(SESSION_LOGIN_TS_KEY, String(Date.now()));
      }
      if (!alreadySent) {
        sessionStorage.setItem(SESSION_LOGGED_KEY, "1");
        sendSessionEvent("login");
      }
    }

    function endAdminSession() {
      if (logoutSentForSession) return;
      logoutSentForSession = true;
      sendSessionEvent("logout");
      sessionStorage.removeItem(SESSION_AUTH_KEY);
      sessionStorage.removeItem(SESSION_ID_KEY);
      sessionStorage.removeItem(SESSION_LOGIN_TS_KEY);
      sessionStorage.removeItem(SESSION_LOGGED_KEY);
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return {
            team: Array.isArray(parsed.team) && parsed.team.length ? parsed.team : [...DEFAULT_TEAM],
            sections: { ...DEFAULT_SECTIONS, ...(parsed.sections || {}) },
            notice: Array.isArray(parsed.notice) && parsed.notice.length ? parsed.notice : [...DEFAULT_NOTICE]
          };
        }
      } catch (_) {}
      return {
        team: [...DEFAULT_TEAM],
        sections: { ...DEFAULT_SECTIONS },
        notice: [...DEFAULT_NOTICE]
      };
    }

    function saveLocalState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (_) {}
    }

    function scheduleAutoSync() {
      saveLocalState();
      setSyncStatus("Saving & syncing...", "text-[#FDE68A]");
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => {
        pushAllToSheet(false);
      }, 900);
    }

    function setSyncStatus(msg, colorClass = "text-[#E5C9B0]") {
      const el = document.getElementById("syncStatusText");
      if (!el) return;
      el.className = `text-xs ${colorClass}`;
      el.textContent = msg;
    }

    async function pushAllToSheet(showAlert = false) {
      saveLocalState();
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.startsWith("PASTE_")) {
        setSyncStatus("Local saved (set GOOGLE_SCRIPT_URL to sync)", "text-[#FDE68A]");
        if (showAlert) alert("Saved locally. Paste your Apps Script Web App URL in GOOGLE_SCRIPT_URL first.");
        return;
      }

      const btn = document.getElementById("pushSheetBtn");
      if (btn) btn.disabled = true;
      setSyncStatus("Pushing to Google Sheet...", "text-[#FDE68A]");

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "saveAll",
            sections: state.sections,
            team: state.team,
            notice: state.notice
          })
        });
        setSyncStatus("Synced with Google Sheet", "text-emerald-300");
        if (showAlert) alert("All changes pushed to Google Sheet successfully!");
      } catch (err) {
        setSyncStatus("Sync failed (saved locally)", "text-red-300");
        if (showAlert) alert("Could not reach Google Sheet. Saved locally.");
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    async function pullFromSheetIfAvailable() {
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.startsWith("PASTE_")) return;
      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getPublicData&t=${Date.now()}`);
        const data = await res.json();
        if (data && data.success) {
          if (Array.isArray(data.team) && data.team.length > 0) {
            state.team = data.team.map((m, idx) => ({
              id: m.id || m["Member ID"] || `tm-${idx + 1}`,
              name: String(m.name || m["Full Name"] || "").trim(),
              role: String(m.role || m["Designation / Role"] || "").trim(),
              photo: String(m.photo || m["Photo URL"] || "./logo.png").trim() || "./logo.png",
              status: String(m.status || m["Status"] || "Active").trim() || "Active"
            })).filter(m => m.name);
          }
          if (data.sections && typeof data.sections === "object") {
            state.sections = { ...state.sections, ...data.sections };
          }
          if (Array.isArray(data.notice) && data.notice.length > 0) {
            state.notice = data.notice.map((n, idx) => ({
              id: n.id || n["Notice ID"] || `item-${idx + 1}`,
              category: n.category || n["Category"] || "Notice",
              status: n.status || n["Status"] || "Published",
              date: n.date || n["Publish Date"] || "",
              title: n.title || n["Headline / Title"] || "",
              image: n.image || n["Image URL"] || "./gallery1.jpg",
              summary: n.summary || n["Summary"] || "",
              fullContent: n.fullContent || n["Full Content"] || ""
            }));
          }
          saveLocalState();
          renderAll();
          setSyncStatus("Loaded latest data from Sheet", "text-emerald-300");
        }
      } catch (_) {}
    }

    function switchTab(tabId) {
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.add("hidden"));
      document.getElementById(tabId).classList.remove("hidden");
      document.querySelectorAll(".tab-btn").forEach(b => {
        if (b.dataset.tab === tabId) {
          b.className = "tab-btn px-4 py-2 rounded-xl bg-[#4E2D1C] text-white text-sm font-semibold";
        } else {
          b.className = "tab-btn px-4 py-2 rounded-xl bg-white text-[#4E2D1C] border border-[#D4C3B3] text-sm font-semibold";
        }
      });
    }

    function updateMember(index, field, value) {
      if (!state.team[index]) return;
      state.team[index][field] = value;
      scheduleAutoSync();
    }

    function moveMember(index, delta) {
      const target = index + delta;
      if (target < 0 || target >= state.team.length) return;
      const temp = state.team[index];
      state.team[index] = state.team[target];
      state.team[target] = temp;
      renderTeam();
      scheduleAutoSync();
    }

    function deleteMember(index) {
      if (!confirm("Remove this member?")) return;
      state.team.splice(index, 1);
      renderTeam();
      scheduleAutoSync();
    }

    function addMember() {
      state.team.push({
        id: "tm-" + (state.team.length + 1),
        name: "New Member",
        role: "Executive Member",
        photo: "./logo.png",
        status: "Active"
      });
      renderTeam();
      scheduleAutoSync();
    }

    function renderTeam() {
      const grid = document.getElementById("teamGrid");
      const badge = document.getElementById("teamCountBadge");
      if (badge) badge.textContent = String(state.team.length);
      if (!grid) return;

      grid.innerHTML = state.team.map((m, idx) => `
        <div class="bg-white p-4 rounded-2xl border border-[#DFD0C2] shadow-sm space-y-2.5">
          <div class="flex items-center justify-between text-xs font-bold text-[#7A5643]">
            <span>Position ${idx + 1}</span>
            <div class="flex gap-1">
              <button type="button" onclick="moveMember(${idx}, -1)" class="px-2 py-0.5 rounded bg-[#F2E8DF] hover:bg-[#E4D3C3]">↑</button>
              <button type="button" onclick="moveMember(${idx}, 1)" class="px-2 py-0.5 rounded bg-[#F2E8DF] hover:bg-[#E4D3C3]">↓</button>
              <button type="button" onclick="deleteMember(${idx})" class="px-2 py-0.5 rounded bg-red-100 text-red-700 hover:bg-red-200">✕</button>
            </div>
          </div>
          <img src="${escapeHtml(m.photo || './logo.png')}" alt="${escapeHtml(m.name)}" onerror="this.src='./logo.png'" class="w-20 h-20 mx-auto rounded-xl object-cover border border-[#D4C3B3]" />
          <input type="text" value="${escapeHtml(m.name)}" oninput="updateMember(${idx}, 'name', this.value)" placeholder="Full Name" class="w-full px-2.5 py-1.5 rounded-lg border border-[#D4C3B3] text-xs font-semibold" />
          <input type="text" value="${escapeHtml(m.role)}" oninput="updateMember(${idx}, 'role', this.value)" placeholder="Designation / Role" class="w-full px-2.5 py-1.5 rounded-lg border border-[#D4C3B3] text-xs" />
          <input type="text" value="${escapeHtml(m.photo || '')}" onchange="updateMember(${idx}, 'photo', this.value); renderTeam();" placeholder="Photo URL (e.g. rikto.png)" class="w-full px-2.5 py-1.5 rounded-lg border border-[#D4C3B3] text-xs text-[#6E4730]" />
        </div>
      `).join("");
    }

    function updateSectionField(key, value) {
      state.sections[key] = value;
      scheduleAutoSync();
    }

    function renderSections() {
      const fields = ["familiesCount", "volunteersCount", "eventsCount", "heroTitle", "heroSubtitle", "aboutText", "donationNumber"];
      fields.forEach(k => {
        const el = document.getElementById("sec_" + k);
        if (el) el.value = state.sections[k] || "";
      });
    }

    function addNotice() {
      state.notice.unshift({
        id: "item-" + Date.now(),
        category: "Notice",
        status: "Published",
        date: new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }),
        title: "New Announcement",
        image: "./gallery1.jpg",
        summary: "Short summary here.",
        fullContent: "Full notice or news content here."
      });
      renderNotice();
      scheduleAutoSync();
    }

    function updateNotice(index, field, value) {
      if (!state.notice[index]) return;
      state.notice[index][field] = value;
      scheduleAutoSync();
    }

    function deleteNotice(index) {
      state.notice.splice(index, 1);
      renderNotice();
      scheduleAutoSync();
    }

    function renderNotice() {
      const wrap = document.getElementById("noticeList");
      if (!wrap) return;
      wrap.innerHTML = state.notice.map((n, idx) => `
        <div class="p-4 rounded-2xl border border-[#DFD0C2] bg-[#FAF6F2] space-y-2">
          <div class="flex items-center justify-between gap-2">
            <input type="text" value="${escapeHtml(n.title)}" oninput="updateNotice(${idx}, 'title', this.value)" class="flex-1 px-3 py-1.5 rounded-lg border border-[#D4C3B3] text-sm font-bold" />
            <button type="button" onclick="deleteNotice(${idx})" class="px-2.5 py-1 rounded-lg bg-red-100 text-red-700 text-xs font-bold">Delete</button>
          </div>
          <textarea rows="2" oninput="updateNotice(${idx}, 'summary', this.value)" class="w-full px-3 py-1.5 rounded-lg border border-[#D4C3B3] text-xs">${escapeHtml(n.summary)}</textarea>
        </div>
      `).join("");
    }

    function renderAll() {
      renderTeam();
      renderSections();
      renderNotice();
    }

    function showDashboard() {
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("adminDashboard").classList.remove("hidden");
      renderAll();
      startAdminSession();
      pullFromSheetIfAvailable();
    }

    function logoutAdmin() {
      endAdminSession();
      document.getElementById("adminDashboard").classList.add("hidden");
      document.getElementById("loginScreen").classList.remove("hidden");
    }

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const u = document.getElementById("loginUser").value.trim();
      const p = document.getElementById("loginPass").value;
      const errEl = document.getElementById("loginError");
      if (u === AUTH_USER && p === AUTH_PASS) {
        errEl.classList.add("hidden");
        sessionStorage.setItem(SESSION_AUTH_KEY, "1");
        showDashboard();
      } else {
        errEl.textContent = "Invalid Admin ID or Password.";
        errEl.classList.remove("hidden");
      }
    });

    window.addEventListener("pagehide", () => {
      if (sessionStorage.getItem(SESSION_AUTH_KEY) === "1") {
        endAdminSession();
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      if (sessionStorage.getItem(SESSION_AUTH_KEY) === "1") {
        showDashboard();
      }
    });
  </script>
</body>
</html>
